name: Security

push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "30 3 * * 1"

permissions:
  contents: read

jobs:
    codeql:
      name: CodeQL
      runs-on: ubuntu-24.04

      permissions:
        security-events: write
        packages: read
        actions: read
        contents: read

      steps:
        - name: Checkout
          uses: actions/checkout@@3d3c42e5aac5ba805825da76410c181273ba90b1
          with:
            persist-credentials: false

        - name: Initialize CodeQL
          uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd
          with:
            languages: javascript-typescript

        - name: Autobuild
          uses: github/codeql-action/autobuild@1c5b675653bb5c22dbe9b12b556ec555138e09fd

        - name: Analyze
          uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd
