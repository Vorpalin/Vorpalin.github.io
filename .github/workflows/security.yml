name: Security

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "30 3 * * 1"

permissions:
  contents: read

jobs:
    codeql:
      name: Security audit
      runs-on: ubuntu-24.04

      permissions:
        security-events: write
        packages: read
        actions: read
        contents: read

      steps:
        - name: Checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
          with:
            persist-credentials: false

        - name: Setup Node.js
          uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
          with:
            node-version: 24
            cache: npm

        - name: Install dependencies
          run: npm ci

        - name: Security audit
          run: npm audit --audit-level=high

        - name: Initialize CodeQL
          uses: github/codeql-action/init@cee97f86b972a3ded3c58d04148362b193ddc518
          with:
            languages: javascript-typescript

        - name: Analyze
          uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d
