name: Build, Deploy & Audit

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build & checks
    runs-on: ubuntu-25.10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build

    runs-on: ubuntu-25.10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  lighthouse:
    name: Lighthouse audit
    if: github.event_name != 'pull_request'
    needs: deploy

    runs-on: ubuntu-25.10

    steps:
      - name: Wait for GitHub Pages
        run: |
          for i in {1..30}; do
            if curl -fsS https://vorpalin.github.io/ > /dev/null; then
              echo "Website is available."
              exit 0
            fi

            echo "Waiting for website..."
            sleep 10
          done

          echo "Website did not become available."
          exit 1

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://vorpalin.github.io/
          uploadArtifacts: true
